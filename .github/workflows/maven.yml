# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
      branches:
        - main
        - Feature/*
        - Bugfix/*
        - Release/*
        - Hotfix/*
        - Develop/*
  pull_request:
      branches:
        - main
        - Feature/*
        - Bugfix/*
        - Release/*
        - Hotfix/*
        - Develop/*
        - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create key files
        run: |
          mkdir -p TaskFlow/infrastructure/src/main/resources
          echo "${{ secrets.APP_PRIVATE_KEY }}" > TaskFlow/infrastructure/src/main/resources/app.key
          echo "${{ secrets.APP_PUBLIC_KEY }}" > TaskFlow/infrastructure/src/main/resources/app.pub
          
      - name: Build with Maven
        run: mvn -B package --file TaskFlow/pom.xml

      - name: Run tests with Maven
        run: mvn -f TaskFlow/pom.xml test
